name: Desktop
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, linux-arm64, windows-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native compiler
        if: matrix.target == 'linux-arm64'
        run: sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu
      - name: Build native decoder and DSP resources
        run: python3 desktop/packaging/build.py '${{ matrix.target }}' --native-only
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            desktop/build/installer-resources
            desktop/build/dist/ffmpeg-*.tar.xz
          compression-level: 0
  package:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-22.04}
          - {target: linux-arm64, runner: ubuntu-24.04-arm}
          - {target: windows-x64, runner: windows-2022}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: desktop/build
      - name: Verify native resources and restore executable permissions
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          python - <<'PYTHON'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'desktop/packaging')
          from verify import verify_machine
          target = os.environ['TARGET']
          windows = target.startswith('windows-')
          native = Path('desktop/build/installer-resources') / ('windows' if windows else 'linux') / 'native'
          decoder = native / ('ffmpeg.exe' if windows else 'ffmpeg')
          dsp = native / ('nekoplayer_audio_effects.dll' if windows else 'libnekoplayer_audio_effects.so')
          for binary in (decoder, dsp):
              verify_machine(binary, target.split('-')[1])
          if not windows:
              # Artifact downloads do not preserve executable mode bits.
              # Restore them before Gradle copies resources into the app bundle.
              decoder.chmod(0o755)
              dsp.chmod(0o755)
          PYTHON
      - name: Install Linux package and UI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          . /etc/os-release
          alsa=libasound2
          if [ "$VERSION_ID" = '24.04' ]; then alsa=libasound2t64; fi
          sudo apt-get install -y ffmpeg fakeroot rpm "$alsa" libxrender1 libxtst6 libxi6 libgl1 xvfb
      - name: Install Windows packaging toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          if (-not $candle) {
            $candle = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*\bin\candle.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $candle) {
            choco install wixtoolset --version=3.14.1 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
            $candle = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*\bin\candle.exe' | Select-Object -First 1
          }
          if (-not $candle) { throw 'WiX 3 compiler is missing' }
          $candlePath = if ($candle -is [System.Management.Automation.ApplicationInfo]) { $candle.Source } else { $candle.FullName }
          $wixBin = Split-Path $candlePath
          if (-not (Test-Path "$wixBin\light.exe")) { throw 'WiX 3 linker is missing' }
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Compile and verify desktop regression tests
        if: runner.os == 'Linux'
        run: ./gradlew -p desktop test --no-daemon
      - name: Build installers with bundled runtime
        shell: bash
        run: ./gradlew -p desktop createDistributable packageDistributionForCurrentOS --no-daemon
      - name: Verify packaged decoder and DSP on Linux
        if: runner.os == 'Linux'
        run: |
          app=desktop/build/compose/binaries/main/app/NekoPlayer
          # Gradle resource copying can drop executable mode bits; restore them
          # on the final bundled binaries immediately before the self-test.
          chmod 755 "$app/lib/app/resources/native/ffmpeg" \
            "$app/lib/app/resources/native/libnekoplayer_audio_effects.so"
          "$app/bin/NekoPlayer" --self-test
      - name: Install MSI and verify shortcuts, launcher and bundled runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem desktop/build/compose/binaries/main/msi/*.msi | Select-Object -First 1).FullName
          $process = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart', '/L*v', "$env:RUNNER_TEMP\nekoplayer-install.log") -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { Get-Content "$env:RUNNER_TEMP\nekoplayer-install.log" -Tail 80; throw "MSI install failed: $($process.ExitCode)" }
          $roots = @($env:LOCALAPPDATA, $env:ProgramFiles, ${env:ProgramFiles(x86)})
          $exe = $roots | ForEach-Object { Get-ChildItem (Join-Path $_ 'NekoPlayer') -Filter NekoPlayer.exe -Recurse -ErrorAction SilentlyContinue } | Select-Object -First 1
          if (-not $exe) { throw 'Installed application launcher is missing' }
          $selfTest = Start-Process $exe.FullName -ArgumentList '--self-test' -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) { throw 'Installed native self-test failed' }
          $shortcut = Get-ChildItem ([Environment]::GetFolderPath('Desktop')) -Filter '*NekoPlayer*.lnk' -ErrorAction SilentlyContinue
          if (-not $shortcut) { throw 'Desktop shortcut was not created' }
          $menu = Get-ChildItem ([Environment]::GetFolderPath('Programs')) -Filter '*NekoPlayer*.lnk' -Recurse -ErrorAction SilentlyContinue
          if (-not $menu) { throw 'Start menu shortcut was not created' }
      - name: Collect installers
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, shutil
          destination = Path('desktop/build/publish')
          destination.mkdir(parents=True, exist_ok=True)
          target = os.environ["TARGET"]
          installers = [path for path in Path('desktop/build/compose/binaries/main').rglob('*') if path.suffix in ('.msi', '.exe', '.deb', '.rpm') and path.parent.name in ('msi', 'exe', 'deb', 'rpm')]
          assert len(installers) == 2, f'Expected two installers, found {installers}'
          version = os.environ.get('GITHUB_REF_NAME', '1.1.0-pre')
          if not version.startswith('v'): version = 'v1.1.0-pre'
          for installer in installers:
              shutil.copy2(installer, destination / f'NekoPlayer-{version}-{target}{installer.suffix}')
          # Linux portable archives contain the bundled JVM and executable launcher,
          # so they run on RPM based and other glibc distributions without a package manager.
          if target.startswith('linux-'):
              import tarfile
              app = Path('desktop/build/compose/binaries/main/app/NekoPlayer')
              assert (app / 'bin/NekoPlayer').is_file(), f'Missing portable launcher: {app}'
              portable = destination / f'NekoPlayer-{version}-{target}.tar.gz'
              with tarfile.open(portable, 'w:gz') as archive:
                  archive.add(app, arcname='NekoPlayer')
          for source in Path('desktop/build/dist').glob('ffmpeg-*.tar.xz'):
              shutil.copy2(source, destination / source.name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: desktop/build/publish/*
          compression-level: 0
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      - name: Verify release installers and checksums
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [path for path in Path('artifacts').iterdir()
                   if path.suffix in ('.msi', '.exe', '.deb', '.rpm') or path.name.endswith('.tar.gz')]
          assert len(files) == 8, f'Expected 8 desktop packages, found {files}'
          expected_portable = {'NekoPlayer-${{ github.ref_name }}-linux-x64.tar.gz',
                               'NekoPlayer-${{ github.ref_name }}-linux-arm64.tar.gz'}
          actual_portable = {path.name for path in files if path.name.endswith('.tar.gz')}
          assert expected_portable <= actual_portable, f'Missing Linux portable packages: {expected_portable - actual_portable}'
          zip_files = list(Path('artifacts').glob('*.zip'))
          assert not zip_files, f'ZIP packages are not published: {zip_files}'
          PY
          cd artifacts
          sha256sum * > desktop-SHA256SUMS.txt
      - name: Upload verified installers to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          for attempt in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" artifacts/* --clobber
              exit 0
            fi
            sleep 10
          done
          echo 'APK Release was not published; refusing to publish an incomplete release.'
          exit 1
