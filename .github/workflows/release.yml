name: Android release build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify native audio regression tests
        run: |
          for test in audio-engine-test audio-distortion-test; do
            g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iapp/src/main/cpp "app/src/test/cpp/$test.cpp" -o "$RUNNER_TEMP/$test"
            "$RUNNER_TEMP/$test"
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify deployment regression tests
        run: node --test deploy/*.test.*

      - name: Verify shared plugin runtime
        run: |
          npm ci --prefix desktop_flutter/tool/plugin_runtime
          npm run build --prefix desktop_flutter/tool/plugin_runtime
          npm test --prefix desktop_flutter/tool/plugin_runtime
          cmake -S native_plugins -B build/plugin-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build/plugin-tests --parallel
          python3 native_plugins/test_vm.py build/plugin-tests/libnekoplayer_plugins.so
          python3 native_plugins/test_runtime.py build/plugin-tests/libnekoplayer_plugins.so

      - name: Install NDK
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
          echo "NDK installed at: ${ANDROID_HOME}/ndk/26.1.10909125"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Verify Kotlin regression tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease --no-daemon

      - name: Verify universal APK architectures
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          expected = {'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'}
          with ZipFile('app/build/outputs/apk/release/app-release.apk') as apk:
              for library in ('libnekoplayer_audio_effects.so', 'libnekoplayer_plugins.so'):
                  actual = {name.split('/')[1] for name in apk.namelist()
                            if name.startswith('lib/') and name.endswith('/' + library)}
                  assert actual == expected, f'{library}: unexpected APK architectures: {sorted(actual)}'
          print('Verified Android architectures:', ', '.join(sorted(actual)))
          PY

      - name: Rename APK
        run: |
          mkdir -p dist
          version=$(sed -n 's/^versionName=//p' app/version.properties)
          cp app/build/outputs/apk/release/app-release.apk "dist/NekoPlayer-v${version}.apk"

      - name: Upload signed APK for coordinated release
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/NekoPlayer-*.apk
          if-no-files-found: error
