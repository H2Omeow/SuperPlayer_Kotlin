name: Flutter desktop release build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: flutter-desktop-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-decoders:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: windows-x64, prefix: x86_64-w64-mingw32-}
          - {target: windows-arm64, prefix: aarch64-w64-mingw32-}
    defaults:
      run:
        working-directory: desktop_flutter
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified LLVM-MinGW
        run: python3 tool/prepare_windows.py toolchain
      - name: Build verified Windows decoders
        run: python3 tool/build_decoder.py '${{ matrix.target }}' --toolchain-prefix '${{ matrix.prefix }}' --jobs "$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: decoder-${{ matrix.target }}
          path: desktop_flutter/build/decoder/${{ matrix.target }}/package
          if-no-files-found: error

  build:
    needs: windows-decoders
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-22.04, platform: linux, arch: x64}
          - {target: linux-arm64, runner: ubuntu-22.04-arm, platform: linux, arch: arm64}
          - {target: windows-x64, runner: windows-2022, platform: windows, arch: x64}
          - {target: windows-arm64, runner: windows-11-arm, platform: windows, arch: arm64}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop_flutter
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: flutter/flutter
          ref: abaf9c523780a608bd46686fd5e53740a07077f8
          path: .flutter-sdk
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev libsecret-1-dev libepoxy-dev libgnutls28-dev openssl rpm xvfb dbus-x11
          echo "$GITHUB_WORKSPACE/.flutter-sdk/bin" >> "$GITHUB_PATH"
      - name: Set up Windows environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "$env:GITHUB_WORKSPACE\.flutter-sdk\bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}
      - name: Prepare verified native Windows graphics and media dependencies
        if: runner.os == 'Windows'
        run: python tool/prepare_windows.py runtime --target '${{ matrix.target }}'
      - name: Resolve pinned Flutter dependencies
        shell: bash
        run: |
          git -C ../.flutter-sdk fetch --no-tags --depth=1 origin refs/tags/3.47.7:refs/tags/3.47.7
          test "$(git -C ../.flutter-sdk rev-parse '3.47.7^{commit}')" = abaf9c523780a608bd46686fd5e53740a07077f8
          flutter pub get --enforce-lockfile
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: decoder-${{ matrix.target }}
          path: desktop_flutter/build/release-decoder
      - name: Stage verified Windows decoder package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NEKO_TARGET: ${{ matrix.target }}
        run: |
          $package = (Resolve-Path 'build/release-decoder').Path
          python tool/check_artifact.py $env:NEKO_TARGET --decoder-directory $package
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows decoder package failed architecture, source provenance or checksum validation'
          }
          "NEKO_DECODER_DIR=$package" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          'NEKO_REQUIRE_DECODERS=ON' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Analyze Flutter code
        shell: bash
        run: flutter analyze --no-pub
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify shared plugin runtime
        shell: bash
        run: |
          npm ci --prefix tool/plugin_runtime
          npm run build --prefix tool/plugin_runtime
          npm test --prefix tool/plugin_runtime
      - name: Build native plugin runtime and verify host integration
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            cmake -S ../native_plugins -B build/plugin-tests -DCMAKE_BUILD_TYPE=Release
            cmake --build build/plugin-tests --parallel
            library="$PWD/build/plugin-tests/libnekoplayer_plugins.so"
          else
            architecture=x64
            if [ '${{ matrix.arch }}' = arm64 ]; then architecture=ARM64; fi
            cmake -S ../native_plugins -B build/plugin-tests -A "$architecture"
            cmake --build build/plugin-tests --config Release --parallel
            library="$(cygpath -w "$PWD/build/plugin-tests/Release/nekoplayer_plugins.dll")"
          fi
          python ../native_plugins/test_vm.py "$library"
          python ../native_plugins/test_runtime.py "$library"
          echo "NEKO_PLUGIN_LIBRARY=$library" >> "$GITHUB_ENV"
      - name: Run Flutter tests
        shell: bash
        run: flutter test --no-pub
      - name: Verify native validation regressions
        run: python -m unittest discover -s tool -p "test_*.py"
      - name: Compile and execute portable native PCM and DSP validation
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            cmake -S native -B build/native-smoke -DCMAKE_BUILD_TYPE=Release -DNEKO_BUILD_NATIVE_SMOKE=ON
            cmake --build build/native-smoke --parallel
            ctest --test-dir build/native-smoke --output-on-failure
          else
            architecture=x64
            if [ '${{ matrix.arch }}' = arm64 ]; then architecture=ARM64; fi
            cmake -S native -B build/native-smoke -A "$architecture" -DNEKO_BUILD_NATIVE_SMOKE=ON
            cmake --build build/native-smoke --config Release --parallel
            ctest --test-dir build/native-smoke --build-config Release --output-on-failure
          fi
      - name: Build verified Linux decoder package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 tool/build_decoder.py '${{ matrix.target }}' --jobs "$(nproc)"
          echo "NEKO_DECODER_DIR=$PWD/build/decoder/${{ matrix.target }}/package" >> "$GITHUB_ENV"
          echo 'NEKO_REQUIRE_DECODERS=ON' >> "$GITHUB_ENV"
      - name: Compile native Flutter application
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            flutter build linux --release --no-pub
          else
            flutter build windows --release --no-pub --verbose
          fi
      - name: Verify actual bundle architecture
        env:
          NEKO_TARGET: ${{ matrix.target }}
          NEKO_PLATFORM: ${{ matrix.platform }}
          NEKO_ARCH: ${{ matrix.arch }}
        shell: python
        run: |
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tool')
          from check_artifact import verify_bundle
          platform = os.environ['NEKO_PLATFORM']
          root = Path('build') / platform / os.environ['NEKO_ARCH']
          bundle = root / ('release/bundle' if platform == 'linux' else 'runner/Release')
          binaries = verify_bundle(os.environ['NEKO_TARGET'], bundle, require_decoders=True)
          print(f'Verified {len(binaries)} native files in {bundle}')
      - name: Exercise compiled Linux DSP and FFmpeg pipeline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          NEKO_DSP_LIBRARY="$PWD/build/linux/${{ matrix.arch }}/release/bundle/lib/libnekoplayer_dsp.so" \
          NEKOPLAYER_FFMPEG="$PWD/build/linux/${{ matrix.arch }}/release/bundle/native/ffmpeg" \
          NEKOPLAYER_FFPROBE="$PWD/build/linux/${{ matrix.arch }}/release/bundle/native/ffprobe" \
            flutter test --no-pub test/audio_effects_test.dart
      - name: Exercise Linux application startup
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          xvfb-run -a dbus-run-session -- timeout 15s 'build/linux/${{ matrix.arch }}/release/bundle/nekoplayer'
          result=$?
          if [ "$result" != 124 ]; then echo "Application exited unexpectedly: $result"; exit 1; fi
      - name: Exercise Windows application startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $application = Start-Process -FilePath 'build/windows/${{ matrix.arch }}/runner/Release/NekoPlayer.exe' -PassThru
          try {
            Start-Sleep -Seconds 15
            $application.Refresh()
            if ($application.HasExited) { throw "Application exited unexpectedly: $($application.ExitCode)" }
          } finally {
            if (!$application.HasExited) { Stop-Process -Id $application.Id }
          }
      - name: Install verified installer compiler
        if: runner.os == 'Windows'
        run: python tool/prepare_windows.py installer
      - name: Create release installers
        shell: python
        env:
          NEKO_TARGET: ${{ matrix.target }}
          NEKO_PLATFORM: ${{ matrix.platform }}
          NEKO_ARCH: ${{ matrix.arch }}
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path
          root = Path('build') / os.environ['NEKO_PLATFORM'] / os.environ['NEKO_ARCH']
          bundle = root / ('release/bundle' if os.environ['NEKO_PLATFORM'] == 'linux' else 'runner/Release')
          subprocess.run([sys.executable, 'tool/package_release.py', os.environ['NEKO_TARGET'], '--bundle', str(bundle)], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: desktop_flutter/build/dist/*
          if-no-files-found: error
