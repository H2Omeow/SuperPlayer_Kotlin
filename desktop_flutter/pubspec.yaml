name: nekoplayer_desktop
description: NekoPlayer Flutter desktop migration for Windows and Linux.
publish_to: none
version: 1.2.0-dev.1+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.1.0
  crypto: ^3.0.6
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  path: ^1.9.1
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  xml: ^6.6.1
  ffi: ^2.1.5
  path_provider: ^2.1.5

dependency_overrides:
  media_kit_libs_windows_video:
    git:
      url: https://github.com/media-kit/media-kit.git
      ref: c533e446755f51cf53c7e57aea873f2aa5355f81
      path: libs/windows/media_kit_libs_windows_video

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Neko CJK
      fonts:
        - asset: assets/fonts/NotoSansCJKsc-Regular.otf
  assets:
    - assets/music_plugins/
    - assets/fonts/OFL.txt
    - assets/lyric_engine/
    - assets/lyric_engine/assets/
    - assets/lyric_engine/assets/folium-icons/
